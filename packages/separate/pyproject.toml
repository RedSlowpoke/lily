[project]
name = "karaoke-mlx"
version = "0.1.0"
description = "RoFormer stem separation on Apple Silicon with MLX: karaoke and six instruments, for Lily Studio (DECISIONS D112)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.26",
    "numpy>=1.26",
]

[project.scripts]
karaoke-mlx = "karaoke_mlx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    # reference PyTorch implementation, used only by the parity test
    "torch>=2.4",
    "einops>=0.8",
    "rotary-embedding-torch>=0.8",
    "beartype>=0.18",
    "librosa>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
