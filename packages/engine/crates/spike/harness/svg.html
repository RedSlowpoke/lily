<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG phase</title>
<style>
  body { margin: 0; padding: 12px 16px; background: #fff; color: #111; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font: inherit; padding: 8px 14px; }
  .table { overflow-x: auto; margin-bottom: 10px; }
  table { border-collapse: collapse; font: 13px/1.4 ui-monospace, monospace; }
  th, td { padding: 2px 8px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead th { border-bottom: 1px solid #999; font-weight: 600; }
  .bad { color: #b00020; }
  #log { display: block; white-space: pre-wrap; font: 12px/1.35 ui-monospace, monospace; background: #f3f3f3; padding: 6px 8px; min-height: 4em; }
</style>
</head>
<body>
<h1>SVG phase, the 11 pages in the file form (MS3 step 9)</h1>
<div class="row">
<button id="again" type="button" disabled>Run again</button>
<span id="status">Loading…</span>
</div>
<div class="table">
<table>
<thead><tr><th>score</th><th>page</th><th>bytes</th><th>first ms</th><th>reps</th><th>median ms</th><th>p90 ms</th><th>Must / Goal</th><th>verdict</th></tr></thead>
<tbody id="pages"></tbody>
</table>
</div>
<output id="log"></output>
<script src="svg-page.js"></script>
</body>
</html>
